indexpage:
  title: Documentation de NetApp Data Migrator
  summary: NetApp Data Migrator est une application logicielle de migration des données
    de niveau entreprise, multicloud, qui simplifie la migration des données de fichiers
    non structurés depuis des systèmes de stockage sur site ou tiers vers des services
    de stockage cloud publics alimentés par NetApp. NetApp Data Migrator est une application
    indépendante qui s'exécute sur des machines virtuelles gérées par l'utilisateur
    et élimine le besoin de scripts personnalisés complexes et d'outils disparates.
